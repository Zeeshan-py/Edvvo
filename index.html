    <!-- Omnidimension widget: load only if VITE_OMNIDIM_KEY is set at build time -->
    <script>
      (function() {
        var key = "__OMNIDIM_KEY__";
        if (key && key !== "__" + "OMNIDIM_KEY" + "__") {
          var s = document.createElement("script");
          s.id = "omnidimension-web-widget";
          s.async = true;
          s.src = "https://backend.omnidim.io/web_widget.js?secret_key=" + key;
          document.head.appendChild(s);
        }
      })();
    </script>
